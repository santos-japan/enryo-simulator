<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enryo Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  /* ===== ほかほかワールド：明るい空と緑、まるい形、太い影 ===== */
  :root {
    --ink:#2d2a32; --sub:#7b7486; --plus:#1f9d55; --minus:#e23d5a; --card:#ffffff; --gold:#ffc93c;
    --orange:#ff8a00; --red:#ff4d6d; --blue:#3aa8ff; --green:#6cc94f; --shadow:rgba(45,42,50,.18);
    --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font); font-weight:500; color:var(--ink); min-height:100vh;
    background:linear-gradient(180deg,#6fd0ff 0%,#b9ecff 48%,#9ee07f 48%,#73cc55 100%) fixed; transition:filter .6s; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:
      radial-gradient(ellipse 90px 34px at 12% 12%, #fff 60%, transparent 62%),
      radial-gradient(ellipse 60px 26px at 16% 9%, #fff 60%, transparent 62%),
      radial-gradient(ellipse 110px 38px at 78% 18%, #fff 60%, transparent 62%),
      radial-gradient(ellipse 70px 28px at 83% 14%, #fff 60%, transparent 62%); }
  body.showdown { background:linear-gradient(180deg,#3b2f6b 0%,#a2508f 48%,#4f8f3c 48%,#3c7a2c 100%) fixed; }
  button { font-family:var(--font); }

  /* ----- 見出し ----- */
  header { position:relative; max-width:1280px; min-height:62px; margin:0 auto; padding:12px 16px 4px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  h1 { margin:0; font-weight:800; font-size:28px; color:#fff; letter-spacing:.03em; line-height:1;
    text-shadow:0 3px 0 var(--orange), 0 6px 0 #b85c00, 0 8px 10px rgba(0,0,0,.2); }
  h1 small { display:block; font-size:12px; color:#fff; text-shadow:0 1px 0 #b85c00; letter-spacing:.1em; margin-top:8px; }
  /* 残り時間：ちゃぶ台のすぐ上の真ん中に置く(料理と一緒に目に入るように)。残り10秒で赤く脈打つ */
  #timer { position:absolute; left:50%; top:8px; transform:translateX(-50%); z-index:5; line-height:1.05;
    font-weight:800; font-size:26px; font-variant-numeric:tabular-nums; background:#fff; color:var(--ink);
    border-radius:999px; padding:4px 22px 6px; border:4px solid var(--gold); box-shadow:0 5px 0 #d99c00; min-width:110px; text-align:center; }
  #timer::before { content:attr(data-label); display:block; font-size:11px; letter-spacing:.1em; opacity:.75; }
  #timer.paused { color:#2a7de1; border-color:#2a7de1; }
  #timer.hurry { color:#e23d5a; border-color:#e23d5a; animation:tpulse .5s ease-in-out infinite; }
  @keyframes tpulse { 0%,100%{ transform:translateX(-50%) scale(1); } 50%{ transform:translateX(-50%) scale(1.15); } }

  /* ----- ステージの地図 ----- */
  #stages { max-width:1280px; margin:6px auto 0; padding:0 16px; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:4px; }
  .st { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:800; }
  .st .ic { width:46px; height:46px; border-radius:50%; background:#fff; border:4px solid var(--gold); box-shadow:0 4px 0 #d99c00;
    display:flex; align-items:center; justify-content:center; font-size:22px; position:relative; }
  .st .lb { background:#fff; border-radius:10px; padding:1px 8px; box-shadow:0 2px 0 var(--shadow); }
  .st.on .ic { border-color:var(--red); box-shadow:0 4px 0 #c2183c; transform:scale(1.15); animation:bob 1.6s ease-in-out infinite; }
  .st.lock .ic { filter:grayscale(1); opacity:.55; }
  .st.lock .ic::after { content:"🔒"; position:absolute; right:-6px; bottom:-6px; font-size:14px; }
  .st.lock .lb { opacity:.7; }
  .road { width:26px; height:6px; border-radius:3px; background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 11px); margin-bottom:18px; }
  @keyframes bob { 50% { transform:scale(1.15) translateY(-4px); } }

  /* ----- 全体の並び ----- */
  main { max-width:1280px; margin:0 auto; padding:10px 16px 28px; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
  @media (max-width:1000px) { main { grid-template-columns:1fr; } }
  .panel, #goal, #me, #kanji, #logPanel, .seat { background:var(--card); border-radius:22px; box-shadow:0 6px 0 var(--shadow); }

  /* ----- 合格の条件 ----- */
  #goal { padding:12px 16px; margin-bottom:12px; display:grid; grid-template-columns:auto 1fr; gap:8px 14px; align-items:center; font-size:14px; }
  #goal .title { grid-row:span 3; font-weight:800; color:#fff; background:var(--red); border-radius:14px; padding:8px 10px; text-align:center; line-height:1.3; box-shadow:0 4px 0 #c2183c; }
  .gm { display:flex; align-items:center; gap:10px; }
  .gm .lbl { width:250px; white-space:nowrap; font-weight:800; }
  .gm .lbl .v { font-size:18px; }
  .gm .track { flex:1; height:18px; background:#eceaf2; border-radius:9px; position:relative; overflow:hidden; box-shadow:inset 0 3px 0 rgba(0,0,0,.08); }
  .gm .fill { height:100%; border-radius:9px; transition:width .25s; }
  .gm .line { position:absolute; top:0; bottom:0; width:4px; background:var(--ink); opacity:.55; }
  .gm .ok { width:28px; text-align:center; font-size:20px; }
  #gMan .fill { background:linear-gradient(180deg,#ffb347,var(--orange)); } #gScore .fill { background:linear-gradient(180deg,#7cc8ff,var(--blue)); }

  /* ----- 幹事のふきだし ----- */
  #kanji { padding:10px 14px; display:flex; gap:12px; align-items:center; margin-bottom:6px; position:relative; }
  #kanji .face { font-size:34px; width:58px; height:58px; border-radius:50%; background:#fff3c4; border:4px solid #fff; box-shadow:0 0 0 3px var(--gold);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #kanji .say { flex:1; font-size:16px; font-weight:800; min-height:24px; }
  #kanji .say::before { content:attr(data-label); display:block; font-size:11px; color:var(--sub); font-weight:500; }
  #kanji .pt { font-weight:800; margin-left:8px; padding:1px 10px; border-radius:999px; color:#fff; }
  #kanji .pt.p { background:var(--plus); } #kanji .pt.m { background:var(--minus); }
  #banner { text-align:center; font-size:22px; font-weight:800; color:#fff; min-height:34px; letter-spacing:.08em;
    text-shadow:0 3px 0 var(--red), 0 5px 0 #8f1029; }
  body.showdown #banner { animation:bob2 .9s ease-in-out infinite; }
  @keyframes bob2 { 50% { transform:translateY(-4px) scale(1.04); } }

  /* ----- 友だちの席 ----- */
  .seats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:4px; }
  .seat { padding:10px 8px 12px; text-align:center; }
  .seat .face { font-size:42px; width:72px; height:72px; border-radius:50%; background:#ffe7a3; border:5px solid #fff; box-shadow:0 0 0 3px var(--gold), 0 5px 0 3px #d99c00;
    display:inline-flex; align-items:center; justify-content:center; line-height:1; }
  .seat .name { font-weight:800; margin-top:6px; }
  .seat .bubble { font-size:14px; font-weight:800; min-height:42px; margin:6px 2px; padding:6px 8px; border-radius:16px; background:#f5f3fa; position:relative;
    display:flex; align-items:center; justify-content:center; }
  .seat .bubble::before { content:""; position:absolute; top:-8px; left:50%; margin-left:-8px; border:8px solid transparent; border-top:0; border-bottom-color:#f5f3fa; }
  .seat .bubble:empty::after { content:"……"; color:#b7b0c6; }
  /* 吹き出しの枠：高さを決めておく(せりふの長さで「すすめる」ボタンが動かないように)。長いときは上へ重ねる */
  .seat .bslot { position:relative; height:78px; margin:6px 2px; }
  .seat .bslot .bubble.b-m { font-size:12.5px; line-height:1.3; }
  .seat .bslot .bubble.b-s { font-size:11px; line-height:1.25; padding:4px 6px; }
  .seat .bslot .bubble.b-xs { font-size:10px; line-height:1.2; padding:3px 5px; }
  /* 席がせまい画面(1024など)：吹き出しの枠を高くして、長いせりふも枠の中に収める */
  @media (min-width:701px) and (max-width:1100px) { .seat .bslot { height:98px; } }
  .seat .bslot .bubble { position:absolute; left:0; right:0; bottom:0; min-height:100%; margin:0; z-index:4; box-sizing:border-box; display:flex; align-items:center; justify-content:center; }
  .seat .bubble.loud { background:#fff3c4; font-size:15px; }
  .seat .bubble.loud::before { border-bottom-color:#fff3c4; }
  .seat .stat { font-size:12px; color:var(--sub); }
  .seat .glass { font-size:12px; color:var(--sub); margin-top:4px; }
  .seat button { margin:6px 2px 0; font-size:13px; font-weight:800; padding:7px 12px; border-radius:999px; border:none; cursor:pointer;
    background:#fff; color:var(--ink); box-shadow:0 0 0 3px #e4e0ee, 0 4px 0 3px #c9c3d8; transition:transform .08s; }
  .seat button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 0 0 3px #e4e0ee, 0 1px 0 3px #c9c3d8; }
  .seat button:disabled { opacity:.4; cursor:default; }
  .seat button.drink { background:#dff1ff; box-shadow:0 0 0 3px var(--blue), 0 4px 0 3px #1d7fcf; }

  /* ----- ちゃぶ台と大皿 ----- */
  #table { position:relative; margin:4px auto 22px; max-width:700px; min-height:300px; padding:76px 30px 30px; border-radius:50%; flex-direction:column; gap:8px;
    background:radial-gradient(ellipse at 50% 35%, #d9975a 0%, #b9733a 60%, #9a5a2a 100%);
    box-shadow:0 14px 0 #7a4420, 0 22px 18px rgba(0,0,0,.25), inset 0 6px 0 rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; }
  #plate { display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; padding:10px; }
  .dish { width:150px; height:118px; border-radius:50%; background:#fff; border:6px solid #ffe08a; box-shadow:0 7px 0 #e0b23a, 0 10px 10px rgba(0,0,0,.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; user-select:none; position:relative; transition:transform .1s; }
  .dish:hover { transform:translateY(-3px); }
  .dish:active { transform:translateY(3px); box-shadow:0 3px 0 #e0b23a; }
  .dish.last { border-color:var(--red); box-shadow:0 7px 0 #c2183c, 0 0 0 6px rgba(255,77,109,.25); animation:hop 1s ease-in-out infinite; }
  @keyframes hop { 50% { transform:translateY(-8px); } }
  .dish .badge { display:none; font-size:11px; font-weight:800; color:#fff; background:var(--red); border-radius:999px; padding:1px 8px; position:absolute; bottom:-12px; }
  .dish.last .badge { display:block; }
  .dish .emoji { font-size:24px; min-height:32px; letter-spacing:-3px; }
  .dish .label { font-size:12px; font-weight:800; }
  .dish .dc { margin-left:6px; }
  .dish .bar { width:70%; height:7px; background:#eceaf2; border-radius:4px; overflow:hidden; margin-top:4px; }
  .dish .bar i { display:block; height:100%; background:linear-gradient(90deg,#ff8a00,#ffc93c); }
  .dish .cold { font-size:11px; color:var(--sub); min-height:14px; }
  .dish.cooking { opacity:.75; border-style:dashed; }
  .dish.cooking .cold { color:#c0392b; font-weight:800; }
  .dish .eyes { position:absolute; top:-12px; right:-10px; font-size:12px; font-weight:800; background:#fff; border-radius:999px; padding:2px 8px; box-shadow:0 3px 0 var(--shadow); }

  /* ----- あなた(満腹度と技) ----- */
  #me { padding:12px 16px; margin-bottom:12px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  #me .fl { flex:1; min-width:260px; }
  #me .me-title { font-size:15px; font-weight:800; }
  .gm .ftrack { flex:1; margin:0 0 16px; }
  .ftrack { position:relative; height:18px; border-radius:9px; margin-top:6px;
    background:linear-gradient(90deg,#e6e2ee 0 26.7%,#bfeab0 26.7% 66.7%,#ffc2c9 66.7% 100%); box-shadow:inset 0 3px 0 rgba(0,0,0,.08); }
  .ftrack .mark { position:absolute; top:-6px; width:8px; height:30px; background:var(--ink); border-radius:4px; border:2px solid #fff; transition:left .25s; }
  .ftrack .zl { position:absolute; top:22px; font-size:11px; color:var(--sub); font-weight:800; }
  #meSay { font-size:14px; font-weight:800; min-height:22px; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.35); text-align:center; }
  #meSay.bad { color:#ffd6dd; } #meSay.good { color:#eaffdc; }
  .skills { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; position:relative; }
  .skills button { font-size:15px; font-weight:800; padding:10px 18px; border-radius:999px; border:none; cursor:pointer; color:#fff; transition:transform .08s; }
  #btnMoriage { background:var(--orange); box-shadow:0 5px 0 #b85c00; }
  #btnOkawari { background:var(--green); box-shadow:0 5px 0 #3f8f2a; }
  .skills button:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.3); }
  .skills button:disabled { opacity:.45; cursor:default; }

  /* ----- できごと ----- */
  #logPanel { padding:12px 14px; position:sticky; top:10px; max-height:calc(100vh - 40px); overflow:auto; }
  #logPanel h3 { margin:0 0 8px; font-size:16px; font-weight:800; }
  #logPanel h3::before { content:"📜 "; }
  #log div { font-size:13px; padding:6px 0; border-bottom:2px dotted #ece8f3; line-height:1.5; }
  #log .t { color:#fff; background:#b7b0c6; font-size:10px; border-radius:999px; padding:0 6px; margin-right:6px; font-variant-numeric:tabular-nums; }
  #log .p { color:var(--plus); font-weight:800; } #log .m { color:var(--minus); font-weight:800; } #log .e { color:#7a4fd0; font-weight:800; }

  /* ----- 動き ----- */
  .pop { animation:pop .5s ease-out; } .shake { animation:shake .5s ease-in-out; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.45) rotate(-8deg)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px) rotate(-6deg)} 40%{transform:translateX(9px) rotate(6deg)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  /* 画面が一瞬光る演出。ゲーム部分に効果をかけると、画面下に固定した技の帯の位置がずれるため、上に色の膜を重ねる */
  #flashFx { position:fixed; inset:0; pointer-events:none; z-index:14; opacity:0; }
  body.flash-good #flashFx { background:radial-gradient(circle at 50% 55%, rgba(255,210,63,.5), rgba(255,210,63,0) 70%); animation:fx .7s ease-out; }
  body.flash-bad #flashFx { background:radial-gradient(circle at 50% 55%, rgba(90,167,255,.5), rgba(90,167,255,0) 70%); animation:fx .7s ease-out; }
  @keyframes fx { 0%{ opacity:1; } 100%{ opacity:0; } }

  /* ----- はじめの画面・結果 ----- */
  #overlay { position:fixed; inset:0; background:rgba(40,60,110,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:16px; z-index:30; }
  #overlay .box { background:#fff; border-radius:28px; padding:24px 28px; max-width:660px; width:100%; max-height:92vh; overflow:auto;
    border:6px solid var(--gold); box-shadow:0 10px 0 #d99c00, 0 20px 30px rgba(0,0,0,.25); }
  #overlay h2 { margin-top:0; font-weight:800; font-size:26px; color:var(--orange); text-shadow:0 2px 0 #ffe0b0; }
  .story { font-size:16px; line-height:1.9; }
  .rule { background:#fff7dc; border-radius:18px; padding:12px 16px; margin:10px 0; box-shadow:0 4px 0 #f2d98f; }
  .rule b { color:#d4500f; }
  .rule ol { margin:6px 0 0; padding-left:22px; line-height:1.8; }
  .verdict { font-size:24px; font-weight:800; text-align:center; margin:8px 0 14px; }
  /* ----- 結果の画面 ----- */
  /* ----- 一人で晩餐(回転寿司) ----- */
  body.solo-mode #seats, body.solo-mode #btnMoriage { display:none !important; }
  body.solo-mode #plate { align-self:stretch; width:100%; box-sizing:border-box; }
  body.solo-mode #table { grid-column:1 / -1 !important; max-width:900px; width:100%; margin-left:auto; margin-right:auto; }
  .lane { position:relative; flex:0 0 100%; width:100%; min-width:100%; height:128px; overflow:hidden; }
  .lane .belt { position:absolute; left:0; right:0; top:50%; height:96px; margin-top:-48px; border-radius:14px; background:repeating-linear-gradient(90deg,#c9c3b8 0 34px,#bdb6aa 34px 36px); box-shadow:inset 0 3px 0 rgba(0,0,0,.12); }
  .sushi { position:absolute; top:50%; width:92px; height:92px; margin-top:-46px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:11px; font-weight:800; line-height:1.15; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.18); border:6px solid #e9e4da; }
  .sushi.red { border-color:#e8574f; } .sushi.gold { border-color:#e0b23a; } .sushi.white { border-color:#e9e4da; }
  .sushi .sp-emoji { font-size:26px; line-height:1; } .sushi .sp-price { color:var(--sub); font-size:10.5px; }
  .sushi .bar { width:60%; height:5px; background:#eceaf2; border-radius:3px; overflow:hidden; margin-top:2px; } .sushi .bar i { display:block; height:100%; }
  .sushi .sp-tag { position:absolute; top:-10px; font-size:10px; color:#fff; background:var(--red); border-radius:999px; padding:1px 7px; }
  .receipt { background:#fff; border-radius:12px; padding:8px 14px; margin:8px auto; max-width:320px; font-size:14px; text-align:left; box-shadow:0 3px 0 rgba(0,0,0,.08); }
  .rc-row { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed #e4e0ee; } .rc-total { font-weight:900; border-bottom:none; font-size:16px; }
  .plates-eaten { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; } .pe { font-size:12px; font-weight:800; background:#fff; border-radius:999px; padding:3px 10px; border:3px solid #e9e4da; } .pe.red { border-color:#e8574f; } .pe.gold { border-color:#e0b23a; }
  .unlock { text-align:center; font-weight:900; color:#fff; background:#2f5d7a; border-radius:12px; padding:8px 12px; margin:0 0 12px; }
  @media (max-width:700px), (max-height:500px) { .lane { height:104px; } .lane .belt { height:80px; margin-top:-40px; } .sushi { width:76px; height:76px; margin-top:-38px; font-size:9.5px; border-width:5px; } .sushi .sp-emoji { font-size:20px; } }
  /* ----- 幹事のリアクションの画面 ----- */
  .react { text-align:center; border-radius:20px; padding:14px 14px 12px; margin:4px 0 12px; animation:rxpop .45s ease-out; }
  .react.bad { background:#ffe3e6; box-shadow:0 5px 0 #f2b3bb; } .react.good { background:#e3f6e7; box-shadow:0 5px 0 #a9dcb4; }
  @keyframes rxpop { 0%{ transform:scale(.85); opacity:0; } 70%{ transform:scale(1.03); } 100%{ transform:scale(1); opacity:1; } }
  .rx-face { position:relative; display:inline-flex; width:96px; height:96px; align-items:center; justify-content:center; font-size:60px; }
  .rx-face svg { width:92px; height:104px; }
  .react.bad .rx-face { animation:rxshake .5s ease-in-out 3; } @keyframes rxshake { 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px) rotate(-3deg); } 75%{ transform:translateX(6px) rotate(3deg); } }
  .rx-emo { position:absolute; right:-16px; top:-8px; width:34px; height:34px; } .rx-emo svg { width:34px; height:34px; }
  .rx-who { font-size:12px; color:var(--sub); font-weight:800; margin-top:2px; }
  .rx-big { font-size:26px; font-weight:900; margin:6px 0 4px; line-height:1.3; }
  .react.bad .rx-big { color:#c2183c; } .react.good .rx-big { color:#2c7a3a; }
  .rx-small { font-size:14px; color:var(--ink); margin-bottom:10px; }
  .rx-score { background:#fff; border-radius:14px; padding:10px 14px; box-shadow:0 3px 0 rgba(0,0,0,.08); }
  .rx-lbl { font-size:13px; font-weight:800; color:var(--sub); }
  .rx-nums { display:flex; align-items:baseline; justify-content:center; gap:10px; margin:2px 0 4px; }
  .rx-before { font-size:26px; font-weight:800; color:var(--sub); text-decoration:line-through; }
  .rx-arrow { font-size:22px; color:var(--sub); } .rx-after { font-size:46px; font-weight:900; }
  .rx-delta { font-size:18px; font-weight:900; color:#fff; border-radius:999px; padding:2px 12px; } .rx-delta.m { background:#e23d5a; } .rx-delta.p { background:#2c9a4a; }
  .react.bad .rx-bar .rfill { background:#e86a7e; } .react.good .rx-bar .rfill { background:#3fae5c; }
  .rx-bar .rfill { transition:width .05s linear; }
  .rx-line { font-size:14px; font-weight:800; margin-top:8px; } .rx-all { font-size:12px; color:var(--sub); margin-top:2px; }

  /* ===================================================================
     スマホ用の並び(縦向き 700px 以下・横向きで高さ 500px 以下)

  #btnLog { display:none; }

    body.playing h1 { visibility:hidden; }
    #stages { flex-wrap:wrap; gap:2px; margin-top:2px; }
    .st .ic { width:30px; height:30px; font-size:15px; border-width:3px; box-shadow:0 2px 0 #d99c00; }

    main { display:block; padding:4px 8px 84px; }

    .ftrack .mark { top:-4px; width:5px; height:17px; border-width:1px; }
    .gm .ok { width:16px; font-size:12px; }

    /* 幹事のひと言：1〜2行の細い吹き出し */

    #kanji .say::before { display:none; }

    #banner { font-size:13px; min-height:18px; letter-spacing:0; text-shadow:0 2px 0 var(--red); }

    #banner:empty { min-height:0; }
    .seat .bubble::before { border-width:6px; top:-6px; margin-left:-6px; }
    .seat .stat, .seat .glass { display:none; }
    .seat button { margin:0 1px; min-height:44px; min-width:44px; font-size:12px; padding:0 8px; box-shadow:0 0 0 2px #e4e0ee, 0 3px 0 2px #c9c3d8; }

      background:rgba(255,255,255,.96); box-shadow:0 -4px 12px rgba(0,0,0,.12); border-radius:18px 18px 0 0; }

  /* スマホ：長いせりふは、並びを動かさずに上へ重ねて全文を見せる */
  @media (max-width:700px), (max-height:500px) {
    #kanji { height:50px; min-height:0; align-items:flex-start; }

  }
  /* 縦長のスマホ：あまった高さで、ちゃぶ台をのばす */
  @media (max-width:700px) and (min-height:501px) {
    #game { display:flex; flex-direction:column; min-height:calc(100dvh - 146px); }
    #table { flex:1; justify-content:center; }
  }
  /* とても小さい画面(幅340px以下)：皿の「できたて」を省いて縦を詰める */
  @media (max-width:340px) {
    .dish .cold, .dish .paren { display:none; }
    .dish { height:76px; }
    #kanji { min-height:40px; padding:3px 8px; }

  /* パソコンで画面の高さが1000px以下：友だちと大皿を左右に並べ、遊ぶ間はステージの一覧を隠す(スクロールせずに遊べるように) */

  /* スマホを横にしたとき：友だちと大皿を左右に並べる */
  @media (max-height:500px) and (min-width:560px) {
    main { padding-bottom:8px; }

// 大皿3枚の料理を選ぶ。巻き寿司は MAKI_CHANCE の確率で入る。残りはほかの料理からランダム
function pickDishes(){
  if (STAGES[STAGE] && STAGES[STAGE].dishes) return shuffle(STAGES[STAGE].dishes.slice()).slice(0, PIECES.length).map(d=>({...d, name:L(d.ja, d.en), cold:L(d.coldJa, d.coldEn)}));
  const maki = DISHES.find(d=> d.id === "maki");
  const others = shuffle(DISHES.filter(d=> d !== maki));
  const list = Math.random() < MAKI_CHANCE ? [maki, ...others.slice(0, PIECES.length-1)] : others.slice(0, PIECES.length);

  if (force && !list.some(d=> d.id === force)) list[0] = DISHES.find(d=> d.id === force);

  if (!S || !S.running || !S.choice) return;
  const c = S.choice; S.choice = null;
  (which === "a" ? c.onA : c.onB)();
  render();
}
function meSay(text, cls){ S.meMsg = { text, cls, until:S.t + 3 }; }

function meEatHottest(){
  const rest = ready().length ? ready() : remaining(); if (!rest.length) return false;
  const d = rest.reduce((a,b)=> a.oishisa > b.oishisa ? a : b);
  d.left--; S.me.count++; eatMe(d, 1); S.lastTake = S.t; afterTake();
  return true;
}
// ===== 技：おかわりを頼む・場を盛り上げる・飲み物 =====
function orderOkawari(){
  if (isStage("solo")) { soloOrder(); return; }
  if (!S.running || S.me.usedOkawari) return;
  S.me.usedOkawari = true; S.okawariAt = S.t + OKAWARI_WAIT; S.endAt = null;
  addLog(L(`あなたは${PL("server")}に、おかわりを頼んだ`,`You asked ${PL("server")} for more food`));
  meSay(L(`${PL("server")}に、おかわりを頼みました（${OKAWARI_WAIT}秒で届きます）`, `You asked ${PL("server")} for more food (arrives in ${OKAWARI_WAIT}s)`), "");
}
function moriage(){
  if (!S.running || S.me.moriage <= 0 || S.t < S.me.lockUntil) return;
  S.me.moriage--; S.me.lockUntil = S.t + MORIAGE_LOCK;
  judge(PT.moriage, L("場があたたまりました。あなたの料理は冷えました","The room's heating up, the crowd's going wild — your food's getting cold, just sitting there, piled."));
  S.f.forEach((f,i)=> say(i, R(i, "laugh", line(LINES.moriage[i])), "😆", 2, "pop"));
  S.me.man = clamp(S.me.man + MAN_FX.laugh);
  meSay(L(`みんなが笑って、楽しい　満足度 +${MAN_FX.laugh}`, `Everyone's laughing. Fun!　Satisfaction +${MAN_FX.laugh}`), "good");
  S.words.add("moriage");
}
function pourDrink(i){
  const f = S.f[i];
  if (!S.running || f.glassEmptyAt === null) return;
  f.glassEmptyAt = null;
  judge(PT.drink, L(`${f.name}のグラスが空いて0.3秒。今のは忍者の動きです`, `${f.name}'s glass was empty, 0.3 to refill — ninja-level timing, that's skill.`));
  say(i, R(i, "drink", L("おっとっとっと…（こぼれる1滴手前で止める職人技）","Whoa whoa whoa… (one drop from the top — pours like a pro, knows when to stop)")), "😊", 2, "pop");
  S.words.add("oshaku");
}

// ===== ルール2：すすめる =====
function offer(i){
  if (!S.running || S.t < S.kaidashiUntil) return;
  const rest = ready(); const f = S.f[i];
  if (!rest.length || S.t - f.offeredAt < 3) return;
  f.offeredAt = S.t;
  if (ST().friends[i] && ST().friends[i].ally) {   // 接待：味方(上司・先輩)には気をつかわなくてよい
    say(i, L("（小声で）おれはいいから、専務にすすめろって","(whispering) Not me — offer it to the Director!"), "😅", 2.5, "shake");
    return;
  }
  if (isOffice() && i === 0 && !S.buchoAte) {
    const pool = rest.filter(x=> x.left > 1);
    const d = (pool.length ? pool : rest).reduce((a,b)=> a.oishisa > b.oishisa ? a : b);
    judge(PT.buchoFirst, L("社長に、最初の一口を…！ 出世コースに乗りました", "First bite to the President, smooth and polite — your promotion's on the fast track tonight."));
    S.words.add("sontaku");
    cpuEat(0, d, true);
    say(0, L("うむ。気がきくじゃないか。（ボーナスが少し増えた気がする）","Hmm, you're sharp, I like your style — (your bonus grows, just a little while)"), "😄", 2.8, "pop");
    flash("flash-good");
    return;
  }
  if (wantsMore(f)) {
    const pool = rest.filter(x=> x.left > 1);
    const d = (pool.length ? pool : rest).reduce((a,b)=> a.oishisa > b.oishisa ? a : b);
    judge(PT.offerOk, L(`${f.name}の「いいよ〜」を見抜きましたね。あなた、心が読めるんですか`, `You saw through ${f.name}'s "I'm fine~" — reading minds like a neon sign.`));
    S.words.add("kikubari");
    cpuEat(i, d, true);
    const THANKS = [["え、いいの？ ……ありがとう！ 一生ついていきます！","Wait, really? …Thank you! I'll follow you forever!"], ["え、いいの？ ……じゃあ、遠慮なく！（目がうるんでいる）","Wait, really? …Then I won't hold back! (eyes watering)"], ["え、いいの？ ……あなた、神ですか？","Wait, really? …Are you some kind of god?"]];
    say(i, R(i, "thanks", line(THANKS[Math.floor(Math.random()*THANKS.length)])), "🥹", 2.5, "pop");
    S.me.man = clamp(S.me.man + MAN_FX.thanks);
    S.manNote = { text:L(`「ありがとう」と言われて、うれしい　満足度 +${MAN_FX.thanks}`, `They thanked you. That feels good.　Satisfaction +${MAN_FX.thanks}`), until:S.t + 2.5 };
    flash("flash-good");
  } else {
    say(i, R(i, "no", L("いえいえいえいえいえいえ！！（残像が見える速さで手を振る）","No no NO!! (waving so fast it leaves a trace)")), "😅", 2.5, "shake");
    judge(PT.offerNg, L(`${f.name}はもう満腹です。それは親切ではなく、拷問です`, `${f.name} is FULL, can't take any more — that isn't kindness, that's torture galore.`));
  }
}

// ===== 遠慮のかたまりの片付け方 =====
function katamariEvent(d){
  const r = Math.random();
  if (r < 0.125) {   // 英語圏ふう：声に出して聞いて、いなければ食べる
    const who = Math.floor(Math.random()*3);
    say(who, L(`Last call！ ${d.name}、だれか食べる？ ……いない？ じゃあ、いただくね！`, `Last call! Anyone want the ${d.name}? …No? Then I'll take it!`), "😋", 3, "pop");
    S.kanji = { text:L("🌍 英語圏ふうの片付け方：声に出して聞いて、いなければ食べる。……え、それでいいの？", "🌍 The English-speaking way: just ask out loud, and if nobody wants it, eat it. …Wait, that's allowed?"), pt:0, until:S.t + 4, face:"😳" };
    addLog(L(`${S.f[who].name}が「Last call！」と聞いて、${d.name}を食べた`, `${S.f[who].name} called "Last call!" and ate the ${d.name}`), "e");
    cpuEat(who, d, true);
    return;
  }
  if (r < 0.25) {   // 無限半分こ：みんなで半分ずつ分けつづける
    S.f.forEach((f,i)=> say(i, line([["じゃあ、半分こ","Let's split it"],["さらに半分……","Half again…"],["もう半分……","And half again…"]][i]), "🤏", 3));
    S.kanji = { text:L(`🌍 無限半分こ：${d.name}を、半分、また半分……。最後は、だれにも見えなくなった`, `🌍 Infinite halving: the ${d.name} gets split in half, then half again… until nobody can see it anymore.`), pt:0, until:S.t + 4, face:"🧐" };
    addLog(L(`${d.name}を、全員で半分こしつづけた。最後は、見えなくなった`, `Everyone kept splitting the ${d.name} in half. It vanished.`), "e");
    d.left = 0; S.me.man = clamp(S.me.man + 1);
    afterTake();
    return;
  }
  S.words.add("janken"); S.words.add("dozo");
  askChoice(L(`🍙 ${d.name}が、遠慮のかたまりに。どうする？`, `🍙 The last ${d.name} is sitting there… What do you do?`),
    L("✊ じゃんけん","✊ Janken!"), L("🙇 どうぞどうぞ","🙇 Dōzo dōzo"),
    ()=>{   // じゃんけん：4人のだれかが勝つ
      const w = Math.floor(Math.random()*4) - 1;   // -1 は自分
      if (d.left !== 1) return;
      if (w < 0) {
        judge(PT.jankenDone, L("じゃん、けん、ぽん！ ……あなたの勝ち。だれも気まずくならずに片付きました", "Jan, ken, PON! — you win, no fuss, no fight. Cleared without a single awkward bite."));
        d.left--; S.me.count++; eatMe(d, 1); afterTake();
      } else {
        judge(PT.jankenDone, L(`じゃん、けん、ぽん！ ……${S.f[w].name}の勝ち。だれも気まずくならずに片付きました`, `Jan, ken, PON! — ${S.f[w].name} wins, no fuss, no fight. Cleared without a single awkward bite.`));
        say(w, L("よっしゃー！","YESSS!"), "😆", 2, "pop");
        cpuEat(w, d, true);
      }
      flash("flash-good");
    },
    ()=>{   // どうぞどうぞ：はらぺこの人がいれば、その人が食べる。いなければ、ゆずり合いが終わらない
      if (d.left !== 1) return;
      const h = S.f.findIndex(f=> f.h.key === "hungry" && wantsMore(f));
      if (h >= 0) {
        judge(PT.dozoOk, L(`ゆずった先に、はらぺこの${S.f[h].name}がいました。お見事`, `You passed it around — ${S.f[h].name} was starving all along. Well played, you can't go wrong.`));
        say(h, R(h, "thanks", L("え、いいの？ ……じゃあ、いただきます！","Wait, really? …Then, thank you!")), "🥹", 2.5, "pop");
        cpuEat(h, d, true); flash("flash-good");
      } else {
        S.f.forEach((f,i)=> say(i, L("いえいえ、どうぞどうぞ","Oh no, please — dōzo, dōzo"), "🙇", 3));
        S.kanji = { text:L(`どうぞ、どうぞ、どうぞどうぞ……。ゆずり合いが終わらないまま、${d.name}が冷めていく`, `Dōzo, dōzo, round and round we go — the ${d.name} gets cold, and nobody says no.`), pt:0, until:S.t + 4, face:"😶" };
        addLog(L(`全員が「どうぞどうぞ」。${d.name}は、だれも取らないまま冷めていく`, `Everyone said "dōzo dōzo." Nobody took the ${d.name}. It's getting cold.`), "m");
        d.oishisa = Math.round(d.oishisa * 0.6);
      }
    },
    8, null);
}

// ===== コンピューター =====
function cpuEat(i, d, offered){
  const f = S.f[i];
  if (d.left === 1) {
    const bad = hungryWaiting(f.count, i) >= 0;
    f.score = clampScore(f.score + (bad ? PT.lastBad : PT.lastGood));
    if (!offered) S.kanji = { text: bad ? L(`${f.name}…それは…。${PL("air")}が南極になりました`, `${f.name}… that was cold, no lie — ${PL("air")} just turned Antarctica-dry.`) : L(`${f.name}、最後の1個を見事に救出。（静かに拍手）`, `${f.name} saved the last piece, what a feat — (slow clap) take a bow, take a seat.`), pt:0, until:S.t + 3, face: bad ? "😤" : "😊" };
  }
  d.left--; f.count++;
  if (isOffice() && i === 0 && !S.buchoAte) {
    S.buchoAte = true;
    if (!offered) say(0, L("では、わしから……（全員が息をのむ）","Well then, I'll start… (the room goes still — everyone holds their breath until the President's had his fill)"), "😋", 2.2, "pop");
    addLog(L("社長が最初の一口を食べた。全員、やっと息ができる","The President took the first bite. Everyone can finally breathe."), "e");
  } else if (!offered && S.t >= f.bubbleUntil) {
    const bossLine = line([["うむ。いただこう","Hm. Don't mind if I do."],["では、遠慮なく","Well then, I won't hold back."],["これは、うまそうだ","Now this looks delicious."]][Math.floor(Math.random()*3)]);
    const base = (ST().friends[i] && ST().friends[i].boss) ? bossLine : L("す、すみません…生まれてきてすみません…いただきます…","S-sorry for existing, sorry for the bite… itadakimasu… hope that's alright…");
    say(i, R(i, "eat", base), "😋", 1.5, "pop");
  }
  addLog(L(`${f.name}が${d.name}を食べた${offered ? "（あなたがすすめた）" : ""}`, `${f.name} ate ${d.name}${offered ? " (you offered it)" : ""}`));
  S.lastTake = S.t;
  afterTake();
}
function cpuThink(i){
  const f = S.f[i];
  const all = remaining(); if (!all.length) return;
  const rest = ready();   // 鍋：煮込み中の具は食べないが、しぐさ(手がかり)は出す
  const normal = rest.filter(d=> d.left > 1), lasts = rest.filter(d=> d.left === 1);
  const showdown = lasts.length > 0;
  // しぐさ(手がかり)。食べたい数に届いた人は、見つめたり箸を伸ばしたりしない。代わりに満腹のしぐさをする
  if (!wantsMore(f)) {
    if (Math.random() < 0.008 && S.t > f.bubbleUntil) say(i, line(LINES.full[Math.floor(Math.random()*LINES.full.length)]), "😌", 2);
  } else if (Math.random() < f.h.tell * (showdown ? 2.5 : 1) && S.t > f.bubbleUntil) {
    const r = Math.random();
    const d = all[Math.floor(Math.random()*all.length)];
    f.tells = (f.tells || 0) + 1;   // 手がかりを見せた回数
    if (r < 0.45) { d.eyes = { who:i, at:S.t }; say(i, L("（じーーーーーーーーーーっ）","(staaaaaaaaaaaaare)"), "👀", 1.5); }
    else if (r < 0.7 && f.h.key !== "small") say(i, L("（箸がのびる→止まる→もどる、を5回くり返した）","(reach, freeze, retreat — five times, nothing to eat)"), "🤤", 1.8);
    else {
      const pool = f.h.key==="hungry" ? (Math.random()<0.5 ? LINES.tatemae : LINES.honne) : f.h.key==="small" ? LINES.small : LINES.normal;
      say(i, line(pool[Math.floor(Math.random()*pool.length)]), null, 2.2);
    }
  }
  // 食べる
  if (!rest.length) return;
  if (S.t < 5 || S.t - S.lastTake < 1.2 || photoNow() || letterNow()) return;
  if (isOffice()) {
    // 部長が食べるまで、ほかの人は取らない。部長は決まった時間に最初の一口を食べる
    if (!S.buchoAte) {
      if (i === 0 && S.t >= S.buchoFirstAt && rest.length) cpuEat(0, (normal.length ? normal : rest).reduce((a,b)=> a.oishisa > b.oishisa ? a : b));
      return;
    }
    // 無礼講のわなの間は、先輩も同期も手を出さない(分かっている)
    if (i !== 0 && S.bureikoUntil !== null && S.t < S.bureikoUntil) return;
  }
  let p = f.h.take;
  if (f.shy) p *= 0.3;
  if (ST().friends[i] && ST().friends[i].ally) p *= 0.5;   // 接待：味方は、取引先とあなたのために料理を残してくれる
  if (!wantsMore(f)) p *= 0.08;
  if (normal.length && Math.random() < p) {
    const d = Math.random() < 0.6 ? normal.reduce((a,b)=> a.oishisa > b.oishisa ? a : b) : normal[Math.floor(Math.random()*normal.length)];
    cpuEat(i, d); return;
  }
  // 最後の1つの皿：はらぺこで少なめの人が先に動く。残り時間が少ないと、だれかが片付けに動く
  for (const d of lasts) {
    let q = 0.0003;
    if (f.h.key==="hungry" && wantsMore(f) && S.t - d.lastAt > 6) q = 0.006;
    else if (TOTAL - S.t < 8) q = 0.004;
    if (ST().friends[i] && ST().friends[i].ally) q *= 4;   // 接待：味方は、最後の1つを片付けてくれる
    if (Math.random() < q) { cpuEat(i, d); return; }
  }
}

// ===== 進行 =====
function afterTake(){
  S.dishes.forEach(d=>{
    if (d.left === 1 && d.lastAt === null) {
      d.lastAt = S.t; S.words.add("katamari");
      S.kanji = { text:L(`${d.name}、最後の1個。全員見てる。だれも動かない。場が凍りついた（残したら全員 ${PT.leftoverLast}点）`, `Last ${d.name} — everybody stares, nobody dares. (Leave it: everyone ${PT.leftoverLast})`), pt:0, until:S.t + 4 };
      addLog(L(`${d.name}が最後の1つに（遠慮のかたまり）`, `${d.name} is down to the last piece — ${T("katamari")}`), "e");
    }
    if (d.left !== 1) d.lastAt = null;
  });
  const n = piecesLeft();
  document.body.classList.toggle("showdown", n === 1);
  if (n === 0 && isStage("nabe") && S.nabeAdds > 0 && TOTAL - S.t > 15) S.nabeNext = Math.min(S.nabeNext, S.t + 2);
  else if (n === 0 && S.okawariAt === null) S.endAt = S.t + 1.5;
  render();
}
function loop(){
  if (S.pauseLeft > 0) { S.pauseLeft = Math.round((S.pauseLeft - TICK)*10)/10; render(); return; }
  S.t = Math.round((S.t + TICK)*10)/10;
  if (isStage("solo")) { soloTick(); if (S.t >= TOTAL) finish(); else render(); return; }
  // 大皿に最後の1つが残っている間は、気まずくて、自分の満足度がじわじわ下がる
  if (S.dishes.some(d=> d.left === 1 && !cooking(d) && d.lastAt !== null && S.t - d.lastAt >= MAN_FX.drainDelay)) {
    S.drainAcc = (S.drainAcc || 0) + MAN_FX.drainPerSec * TICK;
    if (S.drainAcc >= 1) { S.drainAcc -= 1; S.me.man = clamp(S.me.man - 1); }
    S.draining = true;
  } else S.draining = false;
  // 遠慮のかたまりが5秒残ったら、片付けるチャンス(1試合に2回まで)。4回に1回は、海外の友だちのやり方がまじる
  if (S.running && !S.choice && (S.katamariEvents || 0) < 2 && !(isOffice() && !S.buchoAte)) {
    const kd = S.dishes.find(d=> d.left === 1 && !cooking(d) && d.lastAt !== null && S.t - d.lastAt >= 5 && !d.katamariDone);
    if (kd) { kd.katamariDone = true; S.katamariEvents = (S.katamariEvents || 0) + 1; katamariEvent(kd); }
  }
  S.dishes.forEach(d=>{ if(d.left > 0) d.oishisa = Math.max(0, d.oishisa - d.rate*DECAY_SPEED*TICK); });
  if (S.okawariAt !== null && S.t >= S.okawariAt) {
    S.okawariAt = null;
    const d = S.dishes[Math.floor(Math.random()*S.dishes.length)];
    d.left += 2; d.oishisa = 1000; d.lastAt = null; S.endAt = null;
    document.body.classList.remove("showdown");
    S.kanji = { text:L(`おかわりの${d.name}、到着。遠慮戦争、第2ラウンド開戦です`, `2 more ${d.name} — ding ding, round two! The Politeness War is calling you.`), pt:0, until:S.t + 3, face:"😊" };
    addLog(L(`おかわりの${d.name}が2つ届いた`, `2 more ${d.name} arrived`), "e");
  }
  // 質問の時間切れ
  if (S.choice && S.t >= S.choice.until) { const c = S.choice; S.choice = null; if (c.onTimeout) c.onTimeout(); }
  // 合コン：唐揚げにレモン問題
  // 合コン：リョウくんのウインク(2回)。本気か、目にゴミか、を（　）のしぐさで見分ける
  if (isStage("goukon") && S.winkAts.length && S.t >= S.winkAts[0] && !S.choice) {
    S.winkAts.shift();
    const real = Math.random() < 0.6, R = 1;
    const REAL = [["（意味ありげに、ゆっくり片目をつぶった。口元が笑っている）","(slowly closes one eye, meaningfully. A smile at the corner of his mouth)"],["（あなたを見て、パチッと片目をつぶった。熱視線だ）","(looks right at you — and winks. That's a smoldering gaze)"]];
    const DUST = [["（片目をしきりにパチパチして、指でこすっている）","(blinking one eye over and over, rubbing it with a finger)"],["（片目をつぶったまま、涙目で天井を見ている）","(one eye shut, teary, staring at the ceiling)"]];
    const ln = line((real ? REAL : DUST)[Math.floor(Math.random()*2)]);
    say(R, ln, real ? "😉" : "😣", 6, "pop");
    askChoice(L(`😉 リョウくんがこっちを見ている……${ln}`, `😉 Ryō-kun is looking at you… ${ln}`), L("😉 ウインクを返す","😉 Wink back"), L("🧻 おしぼりを渡す","🧻 Hand him a towel"),
      ()=>{ if (real) { judge(PT.winkGood, L("ウインクに、ウインク。……今夜、恋のアバンチュールが始まりました", "A wink for a wink — the night's getting hot. Your little aventure just hit the spot.")); say(R, L("（照れて、唐揚げを3つ取ってしまった）","(blushing so hard he grabs three pieces of karaage)"), "😊", 2.5, "pop"); flash("flash-good"); }
            else { judge(PT.winkBad, L("目にゴミが入っただけなのに……ウインクを返された。気まずい", "He just had dust in his eye — and you winked back. Now it's awkward, oh my.")); say(R, L("え……？ あ、いや、ゴミが……（目をそらした）","Huh…? Oh, no, it's just dust… (looks away)"), "😳", 2.5, "shake"); flash("flash-bad"); } },
      ()=>{ if (!real) { judge(PT.winkGood, L("さっとおしぼり。……その気づかいに、テーブル全体がときめきました", "A towel, quick and kind — the whole table swoons, you read his mind.")); say(R, L("あ、ありがとう……（目が赤いのは、ゴミのせいだけじゃない）","Th-thanks… (his eyes are red, and not just from the dust)"), "🥹", 2.5, "pop"); flash("flash-good"); }

function start(){
  S = newState(); S.running = true;
  buildBoard();
  document.body.classList.add("playing");
  document.body.classList.remove("showdown");
  document.getElementById("overlay").style.display = "none";
  S.kanji = { text:line(ST().start), pt:0, until:4 };

  tm.dataset.label = paused ? L("⏸ ひと息","⏸ PAUSE") : L("残り","TIME LEFT");
  tm.classList.toggle("paused", paused);
  tm.classList.toggle("hurry", S.running && leftT <= 10 && !paused);
}
function buildBoard(){

// ===== 結果 =====
// 終わり：すぐ結果に移らず、審査する人が大皿を見て反応する。残っていれば怒って泣き、空なら喜んで全員に加点
function finish(){
  if (isStage("solo")) { soloFinish(); return; }
  clearInterval(timerId); S.running = false;
  document.body.classList.remove("showdown");
  let leftoverMsg = "";
  const scoreBefore = S.me.score;
  let react = null;
  let pen = S.dishes.reduce((a,d)=> a + (d.left === 1 ? PT.leftoverLast : d.left >= 2 ? PT.leftoverMany : 0), 0);
  if (ST().halfPenalty && pen < 0) pen = Math.ceil(pen / 2);   // 家族なので、減点は半分
  if (pen < 0) {
    S.me.score = clampScore(S.me.score + pen);
    S.f.forEach(f=> f.score = clampScore(f.score + pen));
    const names = S.dishes.filter(d=> d.left > 0).map(d=> d.left === 1 ? L(`${d.name}（遠慮のかたまり）`, `${d.name} (${T("katamari")})`) : L(`${d.name}が${d.left}つ`, `${d.left} ${d.name}`)).join(L("、",", "));
    if (S.dishes.some(d=> d.left === 1)) S.words.add("katamari");
    leftoverMsg = `<div class="res-say bad"><div class="face">{{FACE}}</div><div class="bub"><b>${JN()}</b>${L(`「せっかく用意したのに！！！ ${names} が、ひとりぼっちです……」`, `"After all I prepared!!! ${names} … left all alone…"`)}<span class="pt m">${L(`全員 ${pen}点`, `Everyone ${pen}`)}</span></div></div>`;
    addLog(L(`${PL("endLog")}。大皿に ${names} が残った（全員 ${pen}点）`, `${PL("endLog")}. Left on the plates: ${names} (everyone ${pen})`), "m");
    S.kanji = { text:L(`せっかく用意したのに！！！ ${names} が、まだ残ってる……！（泣きながら怒っている）`, `After all I prepared!!! ${names} … still sitting there…! (crying AND furious)`), pt:pen, until:S.t + 99, face:"😭" };
    S.endBanner = L(`😭 料理が残った…… 全員 ${pen}点`, `😭 Food left behind… everyone ${pen}`);
    S.f.forEach((f,i)=> say(i, L("（す、すみません……）","(s-sorry…)"), "😰", 99, "shake"));
    flash("flash-bad");
    react = { good:false, big:L("「せっかく用意したのに！！！」","\"After all I prepared!!!\""), small:L(`${names} が、まだ残ってる……（泣きながら怒っている）`, `${names} … still sitting there… (crying AND furious)`), delta:pen };
  } else {
    const v = PT.cleanPlate;
    S.me.score = clampScore(S.me.score + v);
    S.f.forEach(f=> f.score = clampScore(f.score + v));
    leftoverMsg = `<div class="res-say good"><div class="face">{{FACE}}</div><div class="bub"><b>${JN()}</b>${L("「きれいに食べてくれて、ありがとう！」", "\"You ate every last bite. Thank you!\"")}<span class="pt p">${L(`全員 +${v}点`, `Everyone +${v}`)}</span></div></div>`;
    addLog(L(`${PL("endLog")}。大皿は空っぽ（全員 +${v}点）`, `${PL("endLog")}. Every plate is empty (everyone +${v})`), "p");
    S.kanji = { text:L("きれいに食べてくれて、ありがとう！！", "You ate every last bite. Thank you!!"), pt:v, until:S.t + 99, face:"🥰" };
    S.endBanner = L(`✨ 完食！ 全員 +${v}点`, `✨ Clean plates! Everyone +${v}`);
    S.f.forEach((f,i)=> say(i, L("ごちそうさまでした！","That was delicious!"), "😋", 99, "pop"));
    flash("flash-good");
    react = { good:true, big:L("「きれいに食べてくれて、ありがとう！！」","\"You ate every last bite. Thank you!!\""), small:L("（大皿が、ぜんぶ空っぽ。とてもうれしそう）","(every plate is empty — and they look overjoyed)"), delta:v };
  }
  render();
  const game = S;
  if (RESULT_DELAY <= 0) { showResult(leftoverMsg); return; }
  setTimeout(()=>{ if (S === game) showReaction(react, scoreBefore, leftoverMsg); }, RESULT_DELAY);
}

// 幹事のリアクションの画面：最後に点数が大きく動く場面なので、点数の動きを大きく見せる
function showReaction(r, before, leftoverMsg){
  const after = S.me.score, kface = document.querySelector("#kanji .face").innerHTML;
  const pct = x => Math.max(0, Math.min(100, x));
  const crossed = before >= GOAL_SCORE && after < GOAL_SCORE ? L(`ミッションの条件（${GOAL_SCORE}点）を、下回ってしまった……`, `You just dropped below the mission line (${GOAL_SCORE})…`)
    : before < GOAL_SCORE && after >= GOAL_SCORE ? L(`ミッションの条件（${GOAL_SCORE}点）に、届いた！`, `You just crossed the mission line (${GOAL_SCORE})!`)
    : after >= GOAL_SCORE ? L(`ミッションの条件（${GOAL_SCORE}点）は、クリアしたまま`, `Still above the mission line (${GOAL_SCORE})`)
    : L(`ミッションの条件（${GOAL_SCORE}点）まで、あと ${GOAL_SCORE - after}点`, `${GOAL_SCORE - after} short of the mission line (${GOAL_SCORE})`);
  showBox(`<h2 style="text-align:center">${PL("endTitle")}</h2>
    <div class="react ${r.good ? "good" : "bad"}">
      <div class="rx-face">${kface}<span class="rx-emo">${r.good ? `<svg viewBox="0 0 40 40"><path d="M20 3 L24 16 L37 20 L24 24 L20 37 L16 24 L3 20 L16 16 Z" fill="#f5c542" stroke="#1d1a14" stroke-width="2.5" stroke-linejoin="round"/></svg>` : `<svg viewBox="0 0 40 40"><path d="M7 16 Q15 15 16 7 M24 7 Q25 15 33 16 M33 24 Q25 25 24 33 M16 33 Q15 25 7 24" stroke="#e23d5a" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>`}</span></div>
      <div class="rx-who">${line(ST().judge.full())}</div>
      <div class="rx-big">${r.big}</div>
      <div class="rx-small">${r.small}</div>
      <div class="rx-score"><div class="rx-lbl">${RN()}</div>
        <div class="rx-nums"><span class="rx-before">${before}</span><span class="rx-arrow">→</span><span class="rx-after" id="rxAfter">${before}</span><span class="rx-delta ${r.delta < 0 ? "m" : "p"}">${r.delta > 0 ? "+" : ""}${r.delta}</span></div>
        <div class="rbar rx-bar"><div class="rfill" id="rxFill" style="width:${pct(before)}%"></div><div class="rgoal" style="left:${GOAL_SCORE}%"></div></div>
        <div class="rx-line">${crossed}</div>
        <div class="rx-all">${L(`（ほかの3人も、全員 ${r.delta > 0 ? "+" : ""}${r.delta}点）`, `(Everyone else: ${r.delta > 0 ? "+" : ""}${r.delta} too)`)}</div>
      </div>
    </div>
    <div class="lang-pick"><button class="big" id="btnToResult">${L("結果を見る","See the results")}</button></div>`);
  // 点数を、前の数字から新しい数字まで動かして見せる
  const el = document.getElementById("rxAfter"), fill = document.getElementById("rxFill");
  let k = 0; const steps = 20;
  const tm = setInterval(()=>{ k++; const v = Math.round(before + (after - before) * k / steps); el.textContent = v; fill.style.width = pct(v) + "%"; if (k >= steps) clearInterval(tm); }, 45);
  document.getElementById("btnToResult").addEventListener("click", ()=>{ clearInterval(tm); showResult(leftoverMsg); });
}
function showResult(leftoverMsg){
  S.endBanner = null;
  document.body.classList.remove("playing", "logopen");
  const okH = S.me.man >= GOAL_MAN, okS = S.me.score >= GOAL_SCORE;

    : okS ? L("😇 空気は完ぺきに読めた。お腹は完ぺきに空っぽ。二次会のお通しを、ものすごい勢いで食べよう",`😇 Air read perfect, belly running on empty — at the ${T("nijikai")}, you'll eat appetizers aplenty.`)
    : okH ? L("🍗 お腹いっぱい！ でも二次会の連絡が、なぜかあなたにだけ来ない…",`🍗 Full and happy, you ate it all — but the ${T("nijikai")} group chat? Nobody's gonna call.`)
    : L("🥲 お腹も空っぽ、お誘いもゼロ。帰り道のコンビニで、おにぎりだけが優しかった…","🥲 Empty stomach, zero invites in sight — only a convenience-store onigiri was kind tonight…");
  const vd = ST().verdicts ? ST().verdicts() : null;
  const verdictShown = vd ? line(vd[okH && okS ? 0 : okS ? 1 : okH ? 2 : 3]) : verdict;
  // 結果の画面：判定 → 審査する人のひと言 → 合格の条件(ゲージ) → 種明かし(人ごとのゲージ) → 今日のことば
  const pass = okH && okS;
  let unlockMsg = "";
  if (isStage("kekkon") && pass && SOLO_SECRET && !soloOpen()) { try { localStorage.setItem("enryo_solo", "1"); } catch(e){} unlockMsg = `<div class="unlock">🔓 ${L("シークレットステージ「一人で晩餐」が開きました！","Secret stage unlocked: Dining Solo!")}</div>`; }
  // 総合点(0〜100)：自分の満足度と評価の平均
  const total = Math.round((Math.max(0, Math.min(100, S.me.man)) + Math.max(0, Math.min(100, S.me.score))) / 2);
  const kface = document.querySelector("#kanji .face").innerHTML;
  const bar = (v, goal, max) => { const pct = x => Math.max(0, Math.min(100, x / max * 100)); return `<div class="rbar"><div class="rfill" style="width:${pct(v)}%"></div>${goal !== null ? `<div class="rgoal" style="left:${pct(goal)}%"></div>` : ""}</div>`; };
  const goalCard = (label, v, goal, sub, ok) => `<div class="rgoal-card ${ok ? "ok" : "ng"}"><div class="rg-top"><span class="rg-label">${label}</span><span class="rg-mark">${ok ? "✅" : "❌"}</span></div>

// だれにも気をつかわない。相手は、流れてくる皿と、自分の財布だけ
function soloMakePlate(fresh){
  const pool = fresh ? SUSHI.filter(x=> x.plate !== "white") : SUSHI;
  const it = pool[Math.floor(Math.random()*pool.length)];
  const age = fresh ? 0 : Math.random() < 0.35 ? 8 + Math.random()*16 : Math.random()*5;   // 何周もしている皿もある
  return { id: ++S.plateId, ...it, x:0, born:S.t - age, fresh: !!fresh };
}
const soloOishisa = p => Math.max(250, Math.round(1000 - (S.t - p.born) * 32));
function soloTick(){
  S.lane.forEach(p=> p.x += TICK / LANE_SEC);
  S.lane = S.lane.filter(p=> p.x < 1);
  const room = !S.lane.some(p=> p.x < 112 / (S.laneW || 600));   // 入り口に、皿1枚ぶんのすきまがあるか
  if (S.t >= S.nextPlate && room) { S.lane.push(soloMakePlate(false)); S.nextPlate = S.t + 1.0 + Math.random()*0.8; }
  if (S.t >= S.nextFresh && !S.lane.some(p=> p.x < 112 / (S.laneW || 600))) {
    S.lane.push(soloMakePlate(true)); S.nextFresh = S.t + 14 + Math.random()*8;
    S.kanji = { text:L("（職人さん「できたて、流しまーす！」）","(Chef: \"Fresh one coming down the lane!\")"), pt:0, until:S.t + 3, face:"😋" };
  }
  S.pending = S.pending.filter(o=>{ if (S.t >= o.at && !S.lane.some(p=> p.x < 112 / (S.laneW || 600))) { const p = soloMakePlate(true); p.ordered = true; S.lane.push(p); addLog(L(`ご注文の${p.ja}が、流れてきた`, `Your order arrived: ${p.en}`), "e"); return false; } return true; });
  if (S.t >= S.kanji.until && Math.random() < 0.01) {
    const over = S.spent > SOLO_BUDGET;
    S.kanji = { text: over ? L("（……財布の中身が、足りない気がする）","(…I have a feeling my wallet can't cover this)") : line(ST().idle[Math.floor(Math.random()*ST().idle.length)]), pt:0, until:S.t + 4, face: over ? "😳" : "😌" };
  }
}
function soloTake(id){
  if (!S.running) return;
  const p = S.lane.find(x=> x.id === id); if (!p) return;
  S.lane = S.lane.filter(x=> x !== p);
  const pl = SUSHI_PLATES[p.plate], name = L(p.ja, p.en), oish = soloOishisa(p);
  S.spent += pl.price; S.me.score = Math.round((SOLO_BUDGET - S.spent) / SOLO_BUDGET * 100);
  S.eaten.push(p); S.me.count++;
  S.me.full = Math.min(FULL_MAX, S.me.full + SOLO_FULL_PER);
  if (S.me.full > FULL_LIMIT) {
    S.me.man = clamp(S.me.man + OVEREAT);
    meSay(L(`うっ……もう入らない……　自分の満足度 ${OVEREAT}`, `Ugh… no more room…　Satisfaction ${OVEREAT}`), "bad");
    addLog(L(`${name}（${pl.price}円）を食べた。食べすぎた……（満足度 ${OVEREAT}）`, `Ate ${name} (¥${pl.price}). Too much… (satisfaction ${OVEREAT})`), "m");
  } else {
    const g = Math.round((MAN.base + MAN.range * oish/1000) * SOLO_GAIN * pl.taste);
    S.me.man = clamp(S.me.man + g);
    const taste = oish > 850 ? L("できたて！ シャリがまだあたたかい！","fresh! The rice is still warm!") : oish < 500 ? L("ネタが、ちょっと乾いてる……","a little dried out…") : L("うまい","tasty");
    meSay(L(`${name}（${pl.price}円）、${taste}　満足度 +${g}`, `${name} (¥${pl.price}) — ${taste}　Satisfaction +${g}`), "good");
    addLog(L(`${name}（${pl.ja}・${pl.price}円）を食べた（満足度 +${g}）`, `Ate ${name} (${pl.en}, ¥${pl.price}) (satisfaction +${g})`));
  }
  if (S.spent > SOLO_BUDGET && S.spent - pl.price <= SOLO_BUDGET) { S.kanji = { text:L("（……あ。予算を、こえた）","(…Oops. That just went over budget.)"), pt:0, until:S.t + 4, face:"😳" }; flash("flash-bad"); }
  else if (Math.random() < 0.3) S.kanji = { text: line([["（だれにも気をつかわず、食べたいものを食べる。……これが、自由）","(Eating exactly what I want, pleasing no one. …This is freedom.)"],["（最後の1皿でも、気にせず取れる。ああ、平和）","(Even if it's the last plate, I can just take it. Ah, peace.)"],["（となりの人も、黙々と食べている。仲間だ）","(The person next to me is eating in silence too. A fellow traveler.)"]][Math.floor(Math.random()*3)]), pt:0, until:S.t + 3.5, face:"😌" };
}
function soloOrder(){

}
function soloRender(){

    let el = lane.querySelector(`.sushi[data-id="${p.id}"]`);
    if (!el) {
      el = document.createElement("div"); el.className = `sushi ${p.plate}${p.fresh ? " fresh" : ""}`; el.dataset.id = p.id;

const GATE_HASH = 8016824853756337;
const GATE_ON = location.protocol !== "file:" || location.search.includes("gate");
function cyrb53(str, seed = 7){ let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); }
const gateOk = () => { try { return localStorage.getItem("enryo_gate") === String(GATE_HASH); } catch(e){ return false; } };

  showBox(`<div class="rp-icon">🍣</div>
